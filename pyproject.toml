[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolosimulation"
version = "0.3"
description = "Federated Learning with YOLO and Flower"
license = { file = "LICENSE" }
# Dependencies
dependencies = [
    "flwr[simulation]>=1.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]


[tool.flwr.app]
publisher = "myelocare"
fab-format-version = 1
flwr-version-target = "1.30.0"
fab-include = ["yolosimulation/**/*.py", "LICENSE"]

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "yolosimulation.server_app:app"
clientapp = "yolosimulation.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 2
fraction-evaluate = 0.2
local-epochs = 1
learning-rate = 0.001
batch-size = 1
num-clients = 3
partitioner = "none"
strategy = "FedAvg"

